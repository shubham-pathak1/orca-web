<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/orca-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO Meta Tags -->
  <title>Orca — Local Music Player for Windows</title>
  <meta name="title" content="Orca — Local Music Player for Windows" />
  <meta name="description"
    content="A free, open-source music player for Windows. Bring your own music, browse albums and artists, follow synced lyrics, and listen offline." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://orca-music.vercel.app" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://orca-music.vercel.app" />
  <meta property="og:title" content="Orca — Local Music Player for Windows" />
  <meta property="og:description"
    content="Your local music, albums, artwork, and synced lyrics in one place. A free, open-source music player for Windows." />
  <meta property="og:image" content="https://orca-music.vercel.app/screenshots/library-current.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://orca-music.vercel.app" />
  <meta property="twitter:title" content="Orca — Local Music Player for Windows" />
  <meta property="twitter:description"
    content="Your local music, albums, artwork, and synced lyrics in one place. A free, open-source music player for Windows." />
  <meta property="twitter:image" content="https://orca-music.vercel.app/screenshots/library-current.png" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#030303" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

  <div id="app"></div>
